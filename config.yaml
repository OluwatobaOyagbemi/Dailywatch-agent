# ─────────────────────────────────────────────────────────────
# Daily Watch Agent — edit this file, nothing else.
# ─────────────────────────────────────────────────────────────

# How many videos to send each day
videos_per_day: 5

# Only consider videos published within this many days (keeps it fresh)
max_video_age_days: 60

# Ignore videos shorter than this (filters out Shorts). Set to 0 to allow all.
min_duration_minutes: 4

# true  = only send videos from the creators you list (never strangers from search)
# false = fill any gaps with the search phrases below
creators_only: true

# true  = search each creator's channel for the day's theme (uses `keywords`)
# false = just take each creator's latest uploads, whatever they're about
match_theme: true

# When a creator has nothing on today's theme:
#   false = leave them out that day (message may be shorter, but always on-topic)
#   true  = send their latest upload anyway
fallback_to_latest: false

# When a creator has nothing recent on today's theme, search their older videos
# for the theme too (newest first, never a repeat). Keeps every creator on-topic
# and in the message even on quiet weeks.
older_on_theme: true

# ── Level up ─────────────────────────────────────────────────
# Telegram only. Buttons under each message: ✅ watched (+10 XP), ⏭ skip,
# 💪 practice done (+20 XP); finish everything for a +15 XP perfect-day bonus.
# Streaks, levels and badges live in progress.json. Send /stats to the bot anytime.
gamify: true

# Which day's message carries the weekly recap
recap_day: sunday

# ── Anti-doomscroll ──────────────────────────────────────────
# true = links open YouTube's bare player (no recommendations, comments or Shorts
#        feed). Videos whose creators block embedding fall back to normal links.
distraction_free: true

# Cap the day's total watch time in minutes (0 = no cap). Videos that would push
# you over are skipped in favour of shorter ones.
daily_minutes_budget: 0

# Shown at the end of every message. Override per day with `prompt:` under that day.
prompt: "Before you close this: write down one idea you'll use this week."

# Where to send. One or both of: telegram, email  (see README for the secrets each needs)
deliver: [telegram, email]

# Your weekly plan. One entry per weekday. Leave a day out to make it a rest day.
#   theme    - shown as the message header
#   keywords - words to look for in each creator's videos (defaults to the theme)
#   creators - YouTube channel handles (the part after @ in the channel URL)
#   search   - fallback search phrases, used only when creators_only is false
#   prompt   - (optional) replaces the global prompt for that day
#   task     - (optional) one small thing to do after watching; worth +20 XP
days:
  monday:
    theme: Public Speaking and Communication
    keywords: "public speaking storytelling presentation communication"
    creators: [TED, philipp-humm, JoyceDaniels, TEDx]
    search: ["public speaking skills", "how to communicate confidently"]
    task: "Record a 60-second voice note explaining one idea from today's video."

  tuesday:
    theme: Mentorship and Leadership
    keywords: "leadership leader mentor"
    creators: [MaxwellLeadershipOfficial, femi_lazarus, munroeglobal, SamAdeyemiTV]
    search: ["leadership principles", "mentorship"]
    task: "Write down one leadership habit from today and practise it once before bed."

  wednesday:
    theme: Relationship, Communication and Marriage
    keywords: "marriage relationship love"
    creators: [EzinneZara, PastorDolapoLawal, femi_lazarus, munroeglobal]
    search: ["healthy relationships advice", "preparing for marriage"]
    task: "Send one intentional message of appreciation to someone you care about."

  thursday:
    theme: Finance, Money and Business
    keywords: "money finance business wealth investing"
    creators: [marktilbury, adesinaassets, PastorPoju]
    search: ["biblical finance", "building a business"]
    task: "Spend 10 minutes on your money: check a balance, a budget line or one subscription."

  friday:
    theme: Men's Conference and Fatherhood
    keywords: "men fatherhood father man manhood"
    creators: [munroeglobal, femi_lazarus]
    search: ["men's conference", "fatherhood sermon"]
    task: "Write one sentence about the man and father you're becoming, and one action toward it this week."

  saturday:
    theme: Music, Guitar and Voice Training
    keywords: "guitar lesson vocal singing"
    creators: [andycrowley]
    search: ["vocal warm up exercises", "beginner guitar lesson", "singing technique"]
    task: "Practise for 15 minutes: a warm-up plus the exercise from today's lesson."

  sunday:
    theme: Sermons
    keywords: "sermon message service"
    creators: [KoinoniaGlobal, CelebrationGlobalTV, femi_lazarus, PastorPoju]
    search: ["sunday sermon"]
    prompt: "What's one thing from this message you'll act on this week?"
    task: "Write down the key line or scripture from today's message and one way you'll live it this week."
