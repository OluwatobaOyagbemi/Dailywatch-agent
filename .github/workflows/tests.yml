name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["sent.json", "last_sent.txt", "docs/today.json"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - name: Helper service tests
        run: node --test worker/test
