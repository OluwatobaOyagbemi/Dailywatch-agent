name: Daily Watch

on:
  schedule:
    # Target: 12:00 PM America/New_York, every day.
    # GitHub cron is UTC: 16:00 UTC during EDT (Mar–Nov), 17:00 UTC during EST (Nov–Mar).
    # Both are listed; the gate step below keeps only the one that lands at noon local.
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:   # manual "Run workflow" button

permissions:
  contents: write      # to commit sent.json back

concurrency:
  group: daily-watch
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate on local hour
        id: gate
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          echo "local hour: $HOUR  (event: ${{ github.event_name }})"
          # Manual runs always go. Scheduled runs go if it's 12 PM local,
          # with tolerance for GitHub starting a cron job a bit late.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "12" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not noon local — skipping."
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install deps
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Send today's videos
        if: steps.gate.outputs.run == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: America/New_York
        run: python watch_agent.py

      - name: Save sent history
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "daily-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add sent.json
          git diff --cached --quiet || git commit -m "chore: record sent videos $(date -u +%F)"
          git pull --rebase origin main
          git push
