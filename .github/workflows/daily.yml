name: Daily Watch

# Send time is set with two repository *variables* (Settings → Secrets and variables
# → Actions → Variables), no YAML editing needed:
#   TIMEZONE   e.g. America/New_York, Europe/London, Africa/Lagos   (default America/New_York)
#   SEND_HOUR  0–23, local time                                      (default 12)
#
# GitHub often starts scheduled jobs hours late, so this checks every hour and sends
# on the first run at or after SEND_HOUR that hasn't sent yet today. Already-sent
# runs stop after a few seconds.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send again even if today's message already went out"
        type: boolean
        default: false

permissions:
  contents: write      # to commit sent.json back

concurrency:
  group: daily-watch
  cancel-in-progress: false

env:
  TZ: ${{ vars.TIMEZONE || 'America/New_York' }}
  SEND_HOUR: ${{ vars.SEND_HOUR || '12' }}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # latest state, not the trigger's snapshot

      - name: Decide whether to send
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          HOUR=$(date +%-H); TODAY=$(date +%F); LAST=$(cat last_sent.txt 2>/dev/null || true)
          echo "local time $(date '+%F %H:%M %Z'), send hour $SEND_HOUR, last sent '${LAST}', event $EVENT"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$LAST" = "$TODAY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Already sent today."
          elif [ "$HOUR" -ge "$SEND_HOUR" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Too early."
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Send today's videos
        if: steps.gate.outputs.run == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: "why watch this" notes
          WATCH_PAGE_URL: ${{ vars.WATCH_PAGE_URL }}   # optional; defaults to https://<owner>.github.io/<repo>/
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python watch_agent.py $FORCE

      - name: Save sent history
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "daily-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add sent.json last_sent.txt
          [ -f docs/today.json ] && git add docs/today.json        # today's session for the watch page
          [ -f sent.json.corrupt ] && git add sent.json.corrupt   # keep the backup if history was unreadable
          git diff --cached --quiet || git commit -m "chore: record sent videos $(date +%F)"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push
